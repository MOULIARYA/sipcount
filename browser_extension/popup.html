<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sipcount</title>
<style>
:root{--ink:#0D1321;--surface:#161F31;--surface-2:#1E2A40;--line:#28364F;--text:#E8EEF6;--muted:#8C9AB3;--water:#7CC8FF;--water-deep:#3A9BE0;--water-soft:rgba(124,200,255,.14);--warn:#FF8A5B;--good:#7BE0A8;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;width:340px;background:var(--ink);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.pill{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.warn{background:rgba(255,138,91,.15);color:var(--warn)}
.panel{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.big{font-size:38px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{font-size:15px;font-weight:500;color:var(--muted);margin-left:3px}
.sub{color:var(--muted);font-size:13px}
.track{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;background:var(--water);border-radius:99px}
.track i.over{background:var(--warn)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border-radius:12px;padding:10px 12px}
.tile .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{font-size:11px;color:var(--muted)}
.nudge{background:var(--water-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.nudge b{color:var(--water)}
.nudge.quiet{background:var(--surface-2);color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:70px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bar i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--water-deep);min-height:2px}
.bar i.today{background:var(--water)}
.bar em{font-style:normal;font-size:10px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.it{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.it:last-child{border-bottom:0}
.it span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px}
button{flex:1;border:0;font:inherit;font-weight:700;font-size:13px;padding:10px;border-radius:10px;cursor:pointer;background:var(--surface-2);color:var(--text)}
button.danger{color:var(--warn)}
button:focus-visible{outline:2px solid var(--water);outline-offset:2px}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
input[type=number]{width:84px;font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
a{color:var(--water)}
.foot{font-size:11px;color:var(--muted);text-align:center}
</style>
</head>
<body>
  <div class="row"><h1>💧 Sipcount</h1><span class="pill" id="statusPill">Watching</span></div>

  <div class="panel">
    <h2>Today</h2>
    <div class="big"><span id="todayMl">0</span><small>mL</small></div>
    <div class="sub" id="todayEq">No prompts counted yet today</div>
    <div class="track"><i id="fill" style="width:0%"></i></div>
    <div class="sub" id="budgetLine"></div>
  </div>

  <div class="nudge" id="last"></div>

  <div class="tiles">
    <div class="tile"><div class="v" id="tPrompts">0</div><div class="l">prompts today</div></div>
    <div class="tile"><div class="v" id="tWeek">0 mL</div><div class="l">last 7 days</div></div>
  </div>

  <div class="panel">
    <h2>Last 7 days</h2>
    <div class="bars" id="bars"></div>
  </div>

  <div class="panel">
    <h2>By AI tool · 7 days</h2>
    <div class="list" id="byVendor"></div>
  </div>

  <label>Daily budget (mL) <input type="number" id="budget" min="10" step="10"></label>

  <div class="actions">
    <button id="export">Copy CSV</button>
    <button id="clear" class="danger">Clear data</button>
  </div>
  <p class="foot">Counts only. Nothing you type is stored or sent. <a href="https://github.com/mouliarya/sipcount/blob/main/browser_extension/PRIVACY.md" target="_blank" rel="noopener">Privacy</a></p>
  <script src="engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
