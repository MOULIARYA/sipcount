name: ai_water
description: Sipcount — see the water footprint of your AI prompts. Zero data retention.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # BSD-3. Stores aggregate counters (mL per day) only. Chosen over Drift/sqlite for v0.3
  # because it needs no code generation step in CI and the data is a handful of numbers.
  #
  # PINNED, exactly (I-75, 2026-10-19). Nothing in this project was pinned: CI ran `flutter
  # create` on the stable channel and resolved `^2.3.0` to whatever was newest that morning.
  # Build 29 (7 Oct) got shared_preferences_android 2.4.28 and worked. Build 30 (19 Oct) got
  # 2.5.0 — published 17 Oct, "Updates internal implementation to use Pigeon JNI" — and the
  # release APK died on its first read with
  #   java.lang.NoSuchMethodError: SharedPreferencesApiRegistrar.getAll(..., Continuation)
  # We changed nothing about storage; the dependency moved under us. Moving a pin is now a
  # deliberate change with a build and a phone test behind it, never a side effect of the date.
  shared_preferences: 2.5.6

# The Android implementation is a separate package the facade pulls in; the pin above does not
# reach it. Held at the last pre-JNI version, which is the one build 29 shipped with.
dependency_overrides:
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # GENERATED from engine.js by tools/build-shared.js — never hand-edit.
    # The old models.json (constants v2026-09-14, 2 regions, no output-token weighting) is deleted:
    # leaving a stale constants file on disk is exactly how the three products drifted apart.
    - assets/calc/models.v2.json
    # GENERATED too — synced from the repo root by tools/build-shared.js. The art is Mouli's and
    # the prototype reads it from /assets; copying rather than duplicating keeps one source, so
    # the phone can never show a different picture from the reference design.
    - assets/characters/
