name: ai_water
description: Sipcount — see the water footprint of your AI prompts. Zero data retention.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # BSD-3. Stores aggregate counters (mL per day) only. Chosen over Drift/sqlite for v0.3
  # because it needs no code generation step in CI and the data is a handful of numbers.
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # GENERATED from engine.js by tools/build-shared.js — never hand-edit.
    # The old models.json (constants v2026-09-14, 2 regions, no output-token weighting) is deleted:
    # leaving a stale constants file on disk is exactly how the three products drifted apart.
    - assets/calc/models.v2.json
    # GENERATED too — synced from the repo root by tools/build-shared.js. The art is Mouli's and
    # the prototype reads it from /assets; copying rather than duplicating keeps one source, so
    # the phone can never show a different picture from the reference design.
    - assets/characters/
