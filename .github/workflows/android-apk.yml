name: Android APK

# Builds the Sipcount Android app on every push to main that touches app/ and
# publishes the APK to the "android-latest" pre-release so it can be downloaded
# straight onto a phone. No signing secrets needed: the APK is signed with the
# standard debug key, which is fine for direct install (not for Play Store).

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # 'true' once the signing secrets exist (secrets cannot be referenced in `if:` directly)
      HAS_SIGNING_KEY: ${{ secrets.SIPCOUNT_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Only hand-written files live in git (see app/.gitignore). This generates the
      # Gradle wrapper, build scripts, launcher icons etc. It never overwrites files
      # that already exist, so our Manifest, MainActivity and service are kept.
      - name: Generate Android scaffold
        run: flutter create --platforms=android --org io.sipcount --project-name ai_water .

      # Stable signing: when the two secrets exist, sign with the project key so builds
      # install over each other. Without them, fall back to the runner's throw-away debug key.
      - name: Configure release signing
        if: env.HAS_SIGNING_KEY == 'true'
        shell: bash
        env:
          KS_B64: ${{ secrets.SIPCOUNT_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SIPCOUNT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KS_B64" | base64 -d > android/app/sipcount-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KS_PASS
          keyPassword=$KS_PASS
          keyAlias=sipcount
          storeFile=sipcount-release.jks
          EOF
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('android/app/build.gradle.kts')
          s = p.read_text()
          if 'key.properties' not in s:
              # In Gradle Kotlin DSL `java` resolves to the Java plugin extension, so the
              # class must be imported rather than referenced as java.util.Properties.
              s = 'import java.util.Properties\n' + s
              s = s.replace('android {', '''val keyProps = Properties().apply {
              val f = rootProject.file("key.properties")
              if (f.exists()) f.inputStream().use { load(it) }
          }

          android {''', 1)
              s = s.replace('buildTypes {', '''signingConfigs {
                  create("release") {
                      storeFile = file(keyProps.getProperty("storeFile"))
                      storePassword = keyProps.getProperty("storePassword")
                      keyAlias = keyProps.getProperty("keyAlias")
                      keyPassword = keyProps.getProperty("keyPassword")
                  }
              }

              buildTypes {''', 1)
              s = re.sub(r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                         'signingConfig = signingConfigs.getByName("release")', s)
              p.write_text(s)
          PY
          echo "Release signing configured."

      - run: flutter pub get

      # What this build is made of, in the log and in the release notes. Build 30 broke because a
      # dependency moved and nobody could tell which one from the outside (I-75).
      - name: Record toolchain and dependencies
        run: |
          flutter --version
          flutter pub deps --style=compact > build-deps.txt
          cat build-deps.txt
          # the pins in pubspec.yaml must be what actually resolved
          grep -E '^- shared_preferences_android 2\.4\.28( |$)' build-deps.txt \
            || { echo "::error::shared_preferences_android did not resolve to the pinned 2.4.28 — see pubspec.yaml (I-75)"; exit 1; }

      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      # Every build gets a unique, visible identity: version 0.3.<run#>, Android versionCode = run#,
      # and the short commit SHA shown in Settings so testers can confirm which build they run.
      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name=0.3.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=SIPCOUNT_BUILD=${{ github.run_number }} \
            --dart-define=SIPCOUNT_SHA=${GITHUB_SHA::7} \
            --dart-define=SIPCOUNT_DEMO=true

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/sipcount-android.apk

      - uses: actions/upload-artifact@v5
        with:
          name: sipcount-android-apk
          path: app/build/app/outputs/flutter-apk/sipcount-android.apk
          if-no-files-found: error

  # THE APP OPENS (I-74 / I-75). Build 30 passed analyze, 300+ tests and the build, and froze on
  # the launch logo on the phone: a release-only fault in a native plugin that no unit test can
  # reach. So the exact APK we are about to publish is installed on an Android emulator and
  # launched. The app prints `SIPCOUNT_BOOT ok` once its first screen is up, or
  # `SIPCOUNT_BOOT failed: <reason>` from its error screen (main.dart). No marker within 90 s,
  # or a dead process, fails the build — and nothing is published.
  boot-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: sipcount-android-apk
          path: apk

      # Hardware acceleration for the emulator on GitHub's Linux runners
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and watch the app start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb install -r apk/sipcount-android.apk
            adb logcat -c
            adb shell am start -W -n io.sipcount.ai_water/.MainActivity
            marker=""
            for i in $(seq 1 45); do
              sleep 2
              if ! adb shell pidof io.sipcount.ai_water >/dev/null 2>&1; then
                echo "::error::Sipcount's process died after launch"; adb logcat -d | tail -200; exit 1
              fi
              marker="$(adb logcat -d | grep -E 'SIPCOUNT_BOOT (ok|failed)' | head -1 || true)"
              [ -n "$marker" ] && break
            done
            echo "boot marker: ${marker:-<none>}"
            if echo "$marker" | grep -q 'SIPCOUNT_BOOT ok'; then
              echo "The app reached its first screen."
            else
              echo "::error::The app did not reach its first screen: ${marker:-no boot marker within 90 s (frozen on the launch logo?)}"
              adb logcat -d | grep -E 'flutter|AndroidRuntime|sipcount' | tail -200 || true
              exit 1
            fi

  publish:
    needs: boot-check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: sipcount-android-apk
          path: apk

      - name: Move android-latest tag to this commit
        run: |
          git tag -f android-latest
          git push -f origin android-latest

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Sipcount Android — build ${{ github.run_number }}
          prerelease: true
          body: |
            Build ${{ github.run_number }} from commit ${{ github.sha }}.
            Boot-checked: this exact APK was installed and launched on an Android 13 emulator and reached its first screen.
            In the app: Settings → bottom line shows "build ${{ github.run_number }}".
            Install guide: https://github.com/${{ github.repository }}/blob/main/app/ANDROID-INSTALL.md
          files: apk/sipcount-android.apk
